name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: Node — typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >=22.13 (uses the built-in node:sqlite
          # module, added in Node 22) — Node 20 crashes before pnpm even
          # gets to `install`.
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit -p .

      - name: Vitest
        run: pnpm test

  python:
    name: Python — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: .agents/requirements.txt

      - run: pip install -r requirements.txt

      - name: Pytest
        run: python -m pytest tests/ -q
