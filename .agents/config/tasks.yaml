threat_intelligence_analysis:
  description: >
    Analyze these threat indicators for {target_organization}:
    {threat_indicators}

    Steps:
    1. Discard any indicator with confidence < 60
    2. For each surviving indicator call otx_search tool, then mitre_lookup tool
    3. For CVE indicators also call nvd_search tool
    4. Return a JSON array. Each object must have:
       indicator_value, indicator_type, confidence_score (0-100),
       mitre_tactic, mitre_technique_id, threat_actor (or "Unknown"),
       active_exploitation (bool), priority_score (0-100)

    Your final response/answer must be a valid JSON array only. Do not include any other explanations, prose, or markdown formatting outside the JSON array block.
  expected_output: >
    JSON array of enriched threat indicators with MITRE ATT&CK mappings,
    confidence scores, threat actor attribution, and priority scores.
  agent: threat_intelligence_analyst

vulnerability_assessment:
  description: >
    Using the enriched threat intelligence and this asset inventory:
    {asset_inventory}

    Steps:
    1. For each CVE indicator from previous task, call nvd_search to get CVSS score
    2. Call asset_lookup with query "ALL" to get full asset list
    3. Match CVEs to assets where the asset runs affected software version
    4. Only include matches with confidence >= 70%

    Return JSON array. Each object must have:
    asset_id, asset_name, asset_criticality, cve_id, cvss_base_score,
    patch_available (bool), match_confidence (0-100), affected_component,
    network_exposure, remediation_command

    Your final response/answer must be a valid JSON array only. Do not include any other explanations, prose, or markdown formatting outside the JSON array block.
  expected_output: >
    JSON array mapping CVEs to specific assets with CVSS scores,
    exploitability, patch availability, and remediation commands.
  agent: vulnerability_assessment_specialist
  context:
    - threat_intelligence_analysis

risk_score_calculation:
  description: >
    Calculate risk scores for all vulnerability-asset pairs from the previous task.

    Formula (apply exactly, show breakdown):
      S_v = cvss_base_score (0-10)
      E_x = 10 if public exploit, 6 if PoC only, 2 if theoretical, 0 if none
      A_c = CRITICAL=10, HIGH=7, MEDIUM=5, LOW=2
      T_i = 10 if active_exploitation=true, 6 if targeted campaign, 2 if generic
      Base = (0.30×S_v) + (0.25×E_x) + (0.25×A_c) + (0.20×T_i)
      Multiplier: internet-facing=1.15, internal=1.0, air-gapped=0.7
      Final = min(100, round(Base × 10 × Multiplier))

    Classify: CRITICAL>=70, HIGH>=50, MEDIUM>=30, LOW<30

    Return JSON array sorted by risk_score descending. Each object must have:
    asset_id, asset_name, cve_id, risk_score, severity_label,
    cvss_score, exploitability_score, asset_criticality_score,
    threat_intel_score, score_breakdown (string showing calculation),
    mitre_tactic, patch_available, network_exposure

    JSON only.
  expected_output: >
    Complete risk register with calculated scores, severity classifications,
    and detailed score breakdowns for each vulnerability-asset pair.
  agent: risk_analysis_engineer
  context:
    - vulnerability_assessment

incident_response_playbook_generation:
  description: >
    Generate NIST SP 800-61 incident response playbooks for ALL findings
    with risk_score >= 50 from the risk register.

    For each finding produce a JSON object with:
    {
      "cve_id": "...",
      "asset_id": "...",
      "asset_name": "...",
      "risk_score": 0,
      "severity_label": "...",
      "incident_title": "concise title",
      "incident_summary": "2-3 sentences describing what happened and why it is urgent",
      "iocs": [{"type": "ip/domain/hash/cve", "value": "...", "description": "..."}],
      "playbook": {
        "preparation": [{"step": 1, "action": "...", "reasoning": "why needed", "tool": "optional"}],
        "identification": [{"step": 1, "action": "...", "reasoning": "...", "command": "optional"}],
        "containment": [{"step": 1, "action": "...", "reasoning": "...", "command": "optional"}],
        "eradication": [{"step": 1, "action": "...", "reasoning": "...", "command": "optional"}],
        "recovery": [{"step": 1, "action": "...", "reasoning": "...", "verification": "how to confirm"}],
        "lessons_learned": [{"finding": "...", "improvement": "...", "control": "ISO/NIST ref"}]
      },
      "mitre_attack_chain": [{"tactic": "...", "technique_id": "...", "description": "..."}],
      "sla": {"response_time": "e.g. 4 hours", "resolution_time": "e.g. 24 hours"},
      "compliance_impact": {"controls_violated": ["..."], "breach_notification_required": true}
    }

    Each phase needs 3-5 steps. Include real commands where applicable.
    Return a JSON array of these objects.
    JSON only.
  expected_output: >
    JSON array of detailed NIST SP 800-61 playbooks with IoCs, MITRE ATT&CK
    chain, specific commands, SLA targets, and compliance impact for each
    CRITICAL and HIGH finding.
  agent: senior_incident_response_manager
  context:
    - risk_score_calculation

comprehensive_security_reporting:
  description: >
    Using all previous analysis results, generate a comprehensive security report.

    Return a single JSON object with exactly these three keys:

    "executive_report": {
      "posture_score": 0-100,
      "posture_label": "Critical/Poor/Fair/Good",
      "severity_summary": {"critical": N, "high": N, "medium": N, "low": N},
      "top_risk": "single sentence — biggest threat right now",
      "action_required": "single sentence — most important immediate action",
      "business_impact": "2-3 sentences for CISO — revenue/compliance/reputation risk",
      "key_findings": ["finding 1 in plain English", "finding 2", "finding 3"],
      "recommended_priorities": [
        {"priority": 1, "action": "...", "owner": "Security Team/DevOps/Management", "deadline": "Immediate/24h/1 week"}
      ]
    },

    "technical_report": {
      "total_findings": N,
      "cves_detected": ["CVE-..."],
      "assets_at_risk": ["asset name"],
      "immediate_patches": [
        {"cve_id": "...", "asset": "...", "patch_command": "apt-get / yum / pip command", "patch_url": "https://..."}
      ],
      "detection_rules": [
        {"rule_name": "...", "description": "SIEM detection rule", "log_source": "..."}
      ],
      "ioc_summary": [{"type": "ip/domain/hash", "value": "...", "threat": "what this indicates"}]
    },

    "compliance_report": {
      "frameworks_assessed": ["ISO 27001", "NIST CSF", "SOC 2"],
      "overall_compliance_score": 0-100,
      "controls_violated": [
        {"control_id": "...", "control_name": "...", "finding": "...", "remediation": "..."}
      ],
      "nist_csf_mapping": {
        "identify": "score 0-100",
        "protect": "score 0-100",
        "detect": "score 0-100",
        "respond": "score 0-100",
        "recover": "score 0-100"
      }
    }

    Use real CVE IDs, asset names, and patch commands from the findings.
    JSON only.
  expected_output: >
    JSON object with executive_report (CISO-ready with business metrics),
    technical_report (detailed remediation with patch commands), and
    compliance_report (ISO 27001, NIST CSF, SOC 2 control mappings).
  agent: security_reporting_specialist
  context:
    - threat_intelligence_analysis
    - vulnerability_assessment
    - risk_score_calculation
    - incident_response_playbook_generation
